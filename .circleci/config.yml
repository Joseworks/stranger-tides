version: 2.1

jobs:
  test:
    docker:
      - image: cimg/ruby:4.0.9
        environment:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost/stranger_tides_test
          BUNDLE_PATH: vendor/bundle
      - image: postgres:15
        environment:
          POSTGRES_USER: postgres
          POSTGRES_DB: stranger_tides_test
          POSTGRES_PASSWORD: postgres
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-ruby-4.0.9-{{ arch }}-{{ checksum "Gemfile.lock" }}
      - run:
          name: Install locked dependencies
          command: |
            gem install bundler -v 4.0.24 --no-document
            BUNDLE_FROZEN=true bundle install --jobs 4
      - save_cache:
          paths:
            - vendor/bundle
          key: v2-ruby-4.0.9-{{ arch }}-{{ checksum "Gemfile.lock" }}
      - run:
          name: Wait for PostgreSQL
          command: dockerize -wait tcp://localhost:5432 -timeout 60s
      - run:
          name: Load disposable test database schema
          command: bundle exec rails db:schema:load
      - run:
          name: Verify eager loading
          command: bundle exec rails zeitwerk:check
      - run:
          name: Run regression tests (NOAA HTTP is stubbed)
          command: bundle exec rspec
      - run:
          name: Run RuboCop
          command: bundle exec rubocop
      - run:
          name: Audit dependency vulnerabilities
          command: bundle exec bundler-audit check --update
      - run:
          name: Scan application security (warnings fail CI)
          command: bundle exec brakeman --no-pager
      - run:
          name: Compile production assets
          command: SECRET_KEY_BASE_DUMMY=1 RAILS_ENV=production bundle exec rails assets:precompile

workflows:
  test:
    jobs:
      - test
